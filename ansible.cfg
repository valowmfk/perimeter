# Perimeter — Ansible configuration
#
# Loaded explicitly by the worker (ANSIBLE_CONFIG is set to this file in
# python/tasks/workflows.py and python/workflows/bootstrap_linux.py) and also
# auto-discovered when ansible-playbook runs with this repo as the cwd.
#
# Purpose: stabilize the persistent SSH connection pool so routine runs stop
# emitting the cosmetic "Failed to reset connection: Control socket connect(...):
# No such file or directory" warning. That warning appears when the reboot
# module forces a connection reset and some host's multiplexed socket has
# already aged out past ControlPersist (default 60s). A longer persist window
# plus pipelining keeps sockets alive across tasks and cuts reconnect churn.
#
# control_path is intentionally left at Ansible's default (hashed %C), which
# produces short socket names like ~/.ansible/cp/6196cd01ee — a custom
# %h-%p-%r path would rebuild long names from FQDNs and risk the 108-char
# UNIX-socket limit.

[ssh_connection]
ssh_args = -C -o ControlMaster=auto -o ControlPersist=300s
pipelining = True
