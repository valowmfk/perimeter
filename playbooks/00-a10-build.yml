---
- name: Create Full SLB Config
  connection: local
  hosts: all_vthunder
  # a10.acos_axapi modules connect over aXAPI and require the device
  # coordinates as module args (ansible_host/username/password/port, all
  # required=True). The collection ships no action-group, so apply them
  # per-module via an anchored default sourced from inventory vars.
  # Note: inventory uses ansible_user; the modules want ansible_username.
  # Every module used below must appear here or it fails with
  # "missing required arguments: ansible_host, ...".
  module_defaults:
    a10.acos_axapi.a10_slb_template_persist_cookie: &a10_conn
      ansible_host: "{{ ansible_host }}"
      ansible_username: "{{ ansible_user }}"
      ansible_password: "{{ ansible_password }}"
      ansible_port: "{{ ansible_port }}"
    a10.acos_axapi.a10_slb_template_client_ssl: *a10_conn
    a10.acos_axapi.a10_slb_template_server_ssl: *a10_conn
    a10.acos_axapi.a10_slb_server: *a10_conn
    a10.acos_axapi.a10_health_monitor: *a10_conn
    a10.acos_axapi.a10_health_monitor_method_https: *a10_conn
    a10.acos_axapi.a10_slb_service_group: *a10_conn
    a10.acos_axapi.a10_slb_virtual_server: *a10_conn
  tasks:
  - name: Create Cookie Persistence Template
    a10.acos_axapi.a10_slb_template_persist_cookie:
      state: present
      a10_partition: automation
      name: a10-k6-persist
      cookie_name: a10-k6-persist

  - name: Create Client SSL Template
    a10.acos_axapi.a10_slb_template_client_ssl:
      state: present
      a10_partition: automation
      name: www_klouda_work_client_ssl
      certificate_list:
        - cert: www_klouda_work
          key: www_klouda_work

  - name: Create Server SSL Template
    a10.acos_axapi.a10_slb_template_server_ssl:
      state: present
      a10_partition: automation
      name: server-encrypt
      user_tag: "No cert included - default config for encrypt/decrypt to https server with cert locally installed"

  - name: Create SLB Server 1
    a10.acos_axapi.a10_slb_server:
      state: present
      a10_partition: automation
      name: sslsrv1
      host: 10.127.70.41
      health_check_disable: true
      port_list:
        - port_number: 443
          protocol: tcp
          health_check_disable: true

  - name: Create SLB Server 2
    a10.acos_axapi.a10_slb_server:
      state: present
      a10_partition: automation
      name: sslsrv2
      host: 10.127.70.42
      health_check_disable: true
      port_list:
        - port_number: 443
          protocol: tcp
          health_check_disable: true

  - name: Create SLB Server 3
    a10.acos_axapi.a10_slb_server:
      state: present
      a10_partition: automation
      name: sslsrv3
      host: 10.127.70.43
      health_check_disable: true
      port_list:
        - port_number: 443
          protocol: tcp
          health_check_disable: true

  - name: Create a10.acos_axapi.a10_health_monitor Name and Interval
    a10.acos_axapi.a10_health_monitor:
      state: present
      a10_partition: automation
      name: port-443-hm
      retry: 2
      up_retry: 4
      interval: 5
      timeout: 1

  - name: Create a10.acos_axapi.a10_health_monitor_method_https Expect
    a10.acos_axapi.a10_health_monitor_method_https:
      state: present
      a10_partition: automation
      monitor_name: port-443-hm
      https: true
      https_host: www.klouda.work
      sni: true

  - name: Create SLB service group
    a10.acos_axapi.a10_slb_service_group:
      state: present
      a10_partition: automation
      name: auto_websg
      protocol: tcp
      health_check: port-443-hm
      member_list:
        - name: sslsrv1
          port: 443
        - name: sslsrv2
          port: 443
        - name: sslsrv3
          port: 443

  - name: Create SLB virtual server
    a10.acos_axapi.a10_slb_virtual_server:
      state: present
      a10_partition: automation
      name: Automation-VIP
      ip_address: 10.127.70.10
      netmask: 255.255.255.255
      port_list:
        - port_number: 80
          protocol: http
          service_group: auto_websg
          auto: true
          redirect_to_https: true
        - port_number: 443
          protocol: https
          service_group: auto_websg
          auto: true
          template_persist_cookie: a10-k6-persist
          template_server_ssl: server-encrypt
          template_client_ssl: www_klouda_work_client_ssl
